# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8d7950a909d34512d2c0fb6517449caa"
application_url = "https://shopify.hikyaku.org"
embedded = true
name = "Hikyaku Connect"

[access_scopes]
# read_orders: the orders/paid payload and an order's fulfillment orders.
# read_locations: list the shop's locations so each can be mapped to a
# Hikyaku depot, plus the locations/* webhooks below.
# read_merchant_managed_fulfillment_orders: which location ships which line
# items, plus the fulfillment_orders/* webhooks below.
# AGENTS.md lists every Admin API query the app makes and why. Level 2
# protected customer data (name/address/phone/email on the orders/paid payload;
# fulfillment orders expose the same destination address, though the app
# doesn't query it) requires approval in the Dev Dashboard before this app can
# be published; development stores work without approval.
scopes = "read_orders,read_locations,read_merchant_managed_fulfillment_orders"
use_legacy_install_flow = false

[webhooks]
# Latest STABLE version as of writing. Shopify releases a new version every
# quarter; 2026-10 (the CLI's scaffold default) doesn't go live until
# October 1, 2026 — see https://shopify.dev/docs/api/usage/versioning.
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # The core integration: a paid order is a completed purchase. See
  # docs/BACKEND_HANDOFF.md for the payload this fans out to Hikyaku's API.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]
  name = "hikyaku-order-paid"

  # New or changed locations get flagged for depot mapping in Hikyaku.
  [[webhooks.subscriptions]]
  uri = "/webhooks/locations"
  topics = [
    "locations/create",
    "locations/update",
    "locations/activate",
    "locations/deactivate",
  ]

  # Items of a paid order re-routed to another location after orders/paid,
  # or a scheduled delivery (a prepaid subscription's next box) coming due.
  [[webhooks.subscriptions]]
  uri = "/webhooks/fulfillment_orders"
  topics = [
    "fulfillment_orders/moved",
    "fulfillment_orders/split",
    "fulfillment_orders/merged",
    "fulfillment_orders/cancelled",
    "fulfillment_orders/scheduled_fulfillment_order_ready",
  ]

  # Mandatory for any published app — see
  # https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance.
  # This app persists no customer data, so the customers/* topics answer 200;
  # shop/redact deletes the shop's sessions, Hikyaku connection and Vault
  # secrets. Hikyaku holds the order data as the merchant's processor.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [
  "https://shopify.hikyaku.org/auth/callback",
  "https://shopify.hikyaku.org/auth/shopify/callback",
  "https://shopify.hikyaku.org/api/auth/callback"
]

[build]
include_config_on_deploy = true
# false so `shopify app dev` doesn't overwrite the production URLs above with
# a tunnel URL. For local dev, link a separate dev app instead:
# `shopify app config link` -> shopify.app.dev.toml, then `shopify app config use dev`.
automatically_update_urls_on_dev = false
